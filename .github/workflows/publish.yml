# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade, add @n8n/node-cli@latest as a dev dependency using your package manager.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# The order matters. OIDC cannot publish a package that does not exist yet,
# because npm only lets you add a trusted publisher from an existing package's
# settings page (npm/cli#8544). So the first release needs a token, and every
# release after it can drop the token.
#
# STEP 1 — first release, with a token:
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access Token.
#      Set Packages and scopes to "All packages" with "Read and write". A token
#      scoped to this package by name cannot be created yet — the package does
#      not exist — which is why the scope has to be wider for this one release.
#   2. In GitHub: Settings → Secrets and variables → Actions → New secret.
#      Name it NPM_TOKEN and paste the token value.
#   3. Tag and push. This publishes with provenance, same as every release after.
#
# STEP 2 — immediately afterwards, switch to OIDC and drop the token:
#   1. On npmjs.com, open the now-published package → Settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: partnero
#        Repository name:  n8n-nodes-partnero
#        Workflow name:    publish.yml
#        Environment:      (leave blank unless you use GitHub Environments)
#   4. Delete the NPM_TOKEN secret from this repository. Leave it unset and npm
#      authenticates over OIDC instead, so no long-lived secret sits in GitHub.
#      Do not keep it: npm prefers a token when one is present, and OIDC never
#      engages while NPM_TOKEN is set.
#
# Both routes produce provenance, so the very first published version is
# verifiable. Provenance is signed by GitHub's OIDC infrastructure either way.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Run the following command locally to start an interactive release:
#
#   npm run release
#
# This will lint, build, prompt for a version bump, update the changelog,
# commit, tag, and push — which triggers this workflow to publish to npm.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # Trusted publishing over OIDC needs npm 11.5.1 or newer. The Node version
      # above currently ships a newer npm than that, but which npm arrives with
      # 'lts/*' changes over time, so this pins the floor rather than assuming.
      - name: Ensure npm supports trusted publishing
        run: 'npm install -g npm@latest'

      - name: Install dependencies
        run: 'npm ci'

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write above).
        # Lint and build run automatically as part of the release process.
        #
        # With NPM_TOKEN set (first release), it is written to .npmrc here.
        # With it unset (every release after the trusted publisher is added),
        # the config line is skipped and npm authenticates over OIDC instead.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
